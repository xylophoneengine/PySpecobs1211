[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "specbos1211"
version = "0.1.0"
description = "Pure-Python driver for the JETI specbos 1211 spectroradiometer"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.20",
]

[project.optional-dependencies]
gui = [
    "matplotlib",
    "colour-science",
    "scipy",
]

[tool.setuptools]
py-modules = ["specbos1211", "specbos1211_gui"]
